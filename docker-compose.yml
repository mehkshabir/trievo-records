# One command: docker compose up -d --build   ->  http://localhost:8000
services:
  records:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    volumes: [photos:/data/photos]
    depends_on: [redis]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes: { photos: {} }
# OpenEMR (optional): docker compose -f openemr-config/docker-compose.yml up
