# OpenEMR foundation + Trievo bridge. From trievo-records/: docker compose -f openemr-config/docker-compose.yml up
services:
  mysql:
    image: mariadb:11
    environment: { MYSQL_ROOT_PASSWORD: root }
    volumes: [dbdata:/var/lib/mysql]
  openemr:
    image: openemr/openemr:7.0.2
    ports: ["8080:80"]
    environment: { MYSQL_HOST: mysql, MYSQL_ROOT_PASS: root, OE_USER: admin, OE_PASS: change-me }
    depends_on: [mysql]
  redis:
    image: redis:7
  bridge:
    build: { context: .., dockerfile: integration-bridge/Dockerfile }
    ports: ["8000:8000"]
    environment: { REDIS_URL: "redis://redis:6379" }
    depends_on: [redis]
volumes: { dbdata: {} }
